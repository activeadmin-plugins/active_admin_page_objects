AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "spec/dummy/node_modules/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 130

Naming/PredicatePrefix:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
