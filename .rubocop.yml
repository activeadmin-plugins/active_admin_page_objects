AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "spec/dummy/node_modules/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Public methods keep `**options` by name: the docs refer to it.
Style/ArgumentsForwarding:
  UseAnonymousForwarding: false

Layout/LineLength:
  Max: 130

Naming/PredicatePrefix:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# The selector map is one hash literal; its entries are data, not logic.
Metrics/ModuleLength:
  CountAsOne:
    - hash
